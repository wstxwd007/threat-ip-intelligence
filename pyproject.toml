[project]
name = "threat-ip-intelligence"
version = "0.1.2"
description = "Open-source verified threat IP feeds and conservative MikroTik RouterOS updater"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Threat IP Intelligence contributors"}]

[project.scripts]
tipi-build = "threatip.build:main"
tipi-audit = "threatip.audit:main"
tipi-routeros = "threatip.routeros:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
