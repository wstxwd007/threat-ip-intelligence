name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Run unit tests without external dependencies
        run: python3 -m unittest discover -s tests -v
      - name: Syntax validation
        run: python3 -m compileall -q threatip
